name: Ciclo editorial — descoberta e matérias

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
  push:
    paths:
      - "config/**"
      - "prototipo/**"
      - ".github/workflows/prototipo.yml"

permissions:
  contents: write

jobs:
  validar-e-descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: gemini-3.6-flash
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar configuração editorial
        run: python prototipo/validar_config.py

      - name: Executar testes automatizados
        run: |
          python -m unittest prototipo/testar_prototipo.py -v
          python -m unittest prototipo/testar_coletor.py -v
          python -m unittest prototipo/testar_gemini.py -v
          python -m unittest prototipo/testar_fontes.py -v
          python -m unittest prototipo/testar_materias.py -v

      - name: Coletar sugestões de pauta por RSS
        run: python prototipo/coletar_fontes.py

      - name: Triagem preliminar pelo Gemini (opcional)
        run: python prototipo/curar_com_gemini.py
        continue-on-error: true

      - name: Verificar tecnicamente as fontes originais
        run: python prototipo/verificar_fontes.py

      - name: Redigir matérias para leitura
        run: python prototipo/gerar_materias.py

      - name: Atualizar feed JSON da prévia do site
        run: |
          mkdir -p docs/data
          cp prototipo/saida/materias-editoriais.json docs/data/materias-editoriais.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/materias-editoriais.json
          if git diff --cached --quiet; then
            echo "O feed editorial não teve alterações."
          else
            git commit -m "Atualiza matérias da prévia editorial"
            git push
          fi

      - name: Guardar relatório da descoberta
        uses: actions/upload-artifact@v4
        with:
          name: descoberta-editorial
          path: prototipo/saida/descoberta-fontes.json
          if-no-files-found: error
          retention-days: 14

      - name: Guardar relatório de fontes originais
        uses: actions/upload-artifact@v4
        with:
          name: fontes-verificadas
          path: prototipo/saida/fontes-verificadas.json
          if-no-files-found: error
          retention-days: 14

      - name: Guardar triagem Gemini, se disponível
        uses: actions/upload-artifact@v4
        if: hashFiles('prototipo/saida/triagem-gemini.json') != ''
        with:
          name: triagem-gemini
          path: prototipo/saida/triagem-gemini.json
          if-no-files-found: error
          retention-days: 14

      - name: Guardar matérias editoriais
        uses: actions/upload-artifact@v4
        with:
          name: materias-editoriais
          path: prototipo/saida/materias-editoriais.json
          if-no-files-found: error
          retention-days: 14
