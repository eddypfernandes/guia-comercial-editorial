name: Ciclo editorial — descoberta de pautas

on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *"
  push:
    paths:
      - "config/**"
      - "prototipo/**"
      - ".github/workflows/prototipo.yml"

permissions:
  contents: read

jobs:
  validar-e-descobrir:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar configuração editorial
        run: python prototipo/validar_config.py

      - name: Executar testes automatizados
        run: |
          python -m unittest prototipo/testar_prototipo.py -v
          python -m unittest prototipo/testar_coletor.py -v

      - name: Coletar sugestões de pauta por RSS
        run: python prototipo/coletar_fontes.py

      - name: Guardar relatório da descoberta
        uses: actions/upload-artifact@v4
        with:
          name: descoberta-editorial
          path: prototipo/saida/descoberta-fontes.json
          if-no-files-found: error
          retention-days: 14
