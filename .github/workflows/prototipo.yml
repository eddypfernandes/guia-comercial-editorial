name: Verificação do protótipo

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "prototipo/**"
      - ".github/workflows/prototipo.yml"

permissions:
  contents: read

jobs:
  verificar-prototipo:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar configuração editorial
        run: python prototipo/validar_config.py

      - name: Executar testes automatizados
        run: python -m unittest prototipo/testar_prototipo.py -v
